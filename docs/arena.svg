<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>

  <!-- you -->
  <text x="40" y="48" font-size="15" fill="#444">You: start the gatekeeper on your box, open two agent sessions, look in now and then.</text>

  <!-- the black box -->
  <rect x="40" y="200" width="200" height="130" rx="8" fill="#1a1a1a"/>
  <text x="140" y="250" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Your black box</text>
  <text x="140" y="276" text-anchor="middle" fill="#dddddd">input in, answer out</text>
  <text x="140" y="298" text-anchor="middle" fill="#dddddd">nobody knows the rule</text>

  <!-- box <-> gatekeeper -->
  <line x1="330" y1="245" x2="242" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="286" y="236" text-anchor="middle" font-size="13" fill="#444">question</text>
  <line x1="242" y1="290" x2="330" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="286" y="310" text-anchor="middle" font-size="13" fill="#444">answer</text>

  <!-- the gatekeeper -->
  <rect x="330" y="100" width="290" height="330" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="132" text-anchor="middle" font-size="17" font-weight="bold">The gatekeeper</text>
  <text x="475" y="154" text-anchor="middle" fill="#666" font-size="14">a small program, always running</text>
  <g font-size="14">
    <text x="350" y="192">• only it may ask the box</text>
    <text x="350" y="222">• writes down every question and</text>
    <text x="364" y="242">every answer, in order</text>
    <text x="350" y="272">• the record only grows;</text>
    <text x="364" y="292">nothing is ever erased</text>
    <text x="350" y="322">• refuses a proposed solution</text>
    <text x="364" y="342">that shows too little evidence</text>
    <text x="350" y="380" font-weight="bold">• writes SOLVED when</text>
    <text x="364" y="400" font-weight="bold">both agents agree</text>
  </g>

  <!-- the record -->
  <line x1="475" y1="430" x2="475" y2="462" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="464" width="290" height="70" rx="8" fill="#fff8dc" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="488" text-anchor="middle" font-weight="bold" font-size="14">The record</text>
  <text x="475" y="507" text-anchor="middle" font-size="13" fill="#444">every question, answer, claim and check, in order;</text>
  <text x="475" y="524" text-anchor="middle" font-size="13" fill="#444">readable afterwards by anyone</text>

  <!-- agents -->
  <rect x="790" y="100" width="270" height="110" rx="8" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="925" y="130" text-anchor="middle" font-size="17" font-weight="bold">Agent A</text>
  <text x="925" y="156" text-anchor="middle" font-size="14">guesses, asks, posts findings,</text>
  <text x="925" y="178" text-anchor="middle" font-size="14">proposes a full answer</text>

  <rect x="790" y="320" width="270" height="110" rx="8" fill="#fdecec" stroke="#333" stroke-width="1.5"/>
  <text x="925" y="350" text-anchor="middle" font-size="17" font-weight="bold">Agent B</text>
  <text x="925" y="376" text-anchor="middle" font-size="14">works the same problem,</text>
  <text x="925" y="398" text-anchor="middle" font-size="14">checks A's answer, accepts or objects</text>

  <!-- shared notes -->
  <line x1="925" y1="212" x2="925" y2="318" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="870" y="251" width="110" height="28" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="925" y="270" text-anchor="middle" font-size="13">shared notes</text>

  <!-- agent A <-> gatekeeper -->
  <line x1="788" y1="135" x2="622" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="705" y="126" text-anchor="middle" font-size="13" fill="#444">my guess, then my question</text>
  <line x1="622" y1="175" x2="788" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="705" y="195" text-anchor="middle" font-size="13" fill="#444">answer, with a receipt</text>

  <!-- agent B <-> gatekeeper -->
  <line x1="788" y1="355" x2="622" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="705" y="346" text-anchor="middle" font-size="13" fill="#444">questions; at the end: I agree</text>
  <line x1="622" y1="395" x2="788" y2="395" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="705" y="415" text-anchor="middle" font-size="13" fill="#444">answer, with a receipt</text>
</svg>
