<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- the black box -->
  <rect x="40" y="150" width="190" height="130" rx="8" fill="#1a1a1a"/>
  <text x="135" y="200" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Your black box</text>
  <text x="135" y="226" text-anchor="middle" fill="#dddddd">input in, answer out</text>
  <text x="135" y="248" text-anchor="middle" fill="#dddddd">nobody knows the rule</text>

  <!-- the gatekeeper -->
  <rect x="330" y="90" width="260" height="290" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="120" text-anchor="middle" font-size="17" font-weight="bold">The gatekeeper</text>
  <text x="460" y="142" text-anchor="middle" fill="#555">(a small program, always running)</text>
  <text x="350" y="178">• the only one allowed to ask the box</text>
  <text x="350" y="202">• writes down every question</text>
  <text x="350" y="226">   and every answer, in order</text>
  <text x="350" y="250">• the record only grows;</text>
  <text x="350" y="274">   nothing is ever erased</text>
  <text x="350" y="298">• refuses a solution that shows</text>
  <text x="350" y="322">   too little evidence</text>
  <text x="350" y="356" font-weight="bold">• writes SOLVED when both agents agree</text>

  <!-- box <-> gatekeeper -->
  <line x1="330" y1="200" x2="232" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="281" y="192" text-anchor="middle" fill="#333" font-size="13">question</text>
  <line x1="232" y1="236" x2="330" y2="236" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="281" y="256" text-anchor="middle" fill="#333" font-size="13">answer</text>

  <!-- agents -->
  <rect x="700" y="70" width="220" height="110" rx="8" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
  <text x="810" y="100" text-anchor="middle" font-size="17" font-weight="bold">Agent A</text>
  <text x="810" y="124" text-anchor="middle" fill="#333">guesses, asks, posts findings,</text>
  <text x="810" y="146" text-anchor="middle" fill="#333">proposes a full answer</text>

  <rect x="700" y="290" width="220" height="110" rx="8" fill="#fdecec" stroke="#333" stroke-width="1.5"/>
  <text x="810" y="320" text-anchor="middle" font-size="17" font-weight="bold">Agent B</text>
  <text x="810" y="344" text-anchor="middle" fill="#333">works the same problem,</text>
  <text x="810" y="366" text-anchor="middle" fill="#333">checks A's answer, accepts or objects</text>

  <!-- shared notes between agents -->
  <line x1="810" y1="182" x2="810" y2="288" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="740" y="221" width="140" height="28" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="810" y="240" text-anchor="middle" font-size="13">shared notes</text>

  <!-- agents <-> gatekeeper -->
  <line x1="698" y1="120" x2="592" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="128" text-anchor="middle" fill="#333" font-size="13">my guess, then my question</text>
  <line x1="592" y1="190" x2="698" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="186" text-anchor="middle" fill="#333" font-size="13">answer + receipt</text>

  <line x1="698" y1="350" x2="592" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="345" text-anchor="middle" fill="#333" font-size="13">questions; then: I agree</text>
  <line x1="592" y1="280" x2="698" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="652" y="288" text-anchor="middle" fill="#333" font-size="13">answer + receipt</text>

  <!-- the record -->
  <rect x="330" y="410" width="260" height="44" rx="8" fill="#fff8dc" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="429" text-anchor="middle" font-weight="bold" font-size="14">The record</text>
  <text x="460" y="446" text-anchor="middle" font-size="12" fill="#333">every question, answer, claim and check, in order — readable afterwards by anyone</text>
  <line x1="460" y1="380" x2="460" y2="408" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- you -->
  <text x="135" y="60" font-size="15" fill="#333">You: start the gatekeeper on your box,</text>
  <text x="135" y="80" font-size="15" fill="#333">open two agent sessions, look in now and then.</text>
</svg>
