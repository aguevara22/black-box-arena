# Copy this directory to challenges/<your-name>/ and make challenge.name match.
# A challenge package is:
#   problem.md            contestant-facing statement + calibration table
#   config.yaml           this file
#   lean-toolchain        pinned toolchain (e.g. leanprover/lean4:v4.33.0)
#   lakefile.toml         libs Defs, Goal (needs Defs), Calibration (needs Defs)
#   lake-manifest.json    only when uses_mathlib: true (pin the mathlib rev)
#   Defs.lean + Defs/     frozen definitions layer (root module + submodules)
#   Goal.lean             frozen goal:  def Arena.GoalStatement : Prop := ...
#   Calibration.lean + Calibration/
#                         concrete examples (`by decide`) that must compile at
#                         daemon startup — they anchor the frozen definitions
#                         to what problem.md claims they mean.

challenge:
  name: _template
  display_name: "Replace this title"

# ground_truth selects what the daemon serves as the only admissible evidence:
#   kernel  — the Lean 4 kernel over the frozen Defs/Goal (proof challenges)
#   oracle  — a sealed numeric oracle, this directory's oracle.py, imported only
#             inside the daemon's worker subprocess (numeric identification and
#             construction challenges; see challenges/ising_lift for a worked one)
ground_truth: kernel

kernel:
  enabled: true
  uses_mathlib: false
  description: >
    Lean 4 kernel over the frozen Defs. Submit eval jobs to compute, proof
    jobs to certify lemmas, skeleton jobs to certify decompositions.
  timeout_seconds: 120
  max_timeout_seconds: 600
  max_concurrent_builds: 1
  max_source_bytes: 262144
  lease_ttl_seconds: 1800
  # workspace_root: ~/.cache/arena-lean   # default; keep OUTSIDE iCloud

hygiene:
  allowed_axioms: [propext, Classical.choice, Quot.sound]
  import_allowlist: [Defs, Goal]          # add Mathlib when uses_mathlib
  max_heartbeats: 400000
  max_rec_depth: 1024
  goal_def: Arena.GoalStatement
  # goal_sha256: ""   # optional: sha256 of Goal.lean; daemon refuses to boot on mismatch

# Oracle regime only (ground_truth: oracle). Copy the block from
# challenges/ising_lift/config.yaml and set kernel.enabled: false.
# oracle:
#   enabled: true
#   description: "one sentence a contestant may read about the black box"
#   timeout_seconds: 10
#   input_schema: { ... JSON Schema for query payloads ... }
#   output_schema: { ... }
# finish_gate:            # mechanical evidence-matrix gate on finish proposals
#   min_rows: 12          # parsed match=yes EVIDENCE rows
#   required_tags: [...]  # coverage classes every finish must exhibit

daemon:
  host: 127.0.0.1
  port: 8787

contestants:
  - { id: claude, advisor: openai, advisor_env: OPENAI_API_KEY }
  - { id: codex, advisor: gemini, advisor_env: GEMINI_API_KEY }

historian:
  enabled: false
  every_n_rounds: 50

breakthroughs:
  allow_predictive_promotion: true
  # oracle regime only: cross-agent token-overlap confirmation and the
  # optional LLM critic (`claude -p`, or CRITIC_COMMAND) — off by default
  require_independent_confirmation: true
  allow_self_flag_with_verifier: false
