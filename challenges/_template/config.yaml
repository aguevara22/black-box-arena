# Copy this directory to challenges/<your-name>/ and make challenge.name match.

challenge:
  name: _template
  display_name: "Replace this title"

oracle:
  enabled: false
  description: ""
  input_schema: {}
  output_schema: {}
  timeout_seconds: 10

daemon:
  host: 127.0.0.1
  port: 8787

contestants:
  - { id: claude, advisor: openai, advisor_env: OPENAI_API_KEY }
  - { id: codex, advisor: gemini, advisor_env: GEMINI_API_KEY }

stopping:
  max_rounds: null
  external_solved_signal: null
  idle_minutes_to_halt: null

historian:
  enabled: false
  every_n_rounds: 50

breakthroughs:
  require_independent_confirmation: true
  allow_self_flag_with_verifier: false
  allow_predictive_promotion: true

# Omit this block to send every finish directly to peer verification.
# finish_gate:
#   min_rows: 8
#   required_tags: [small, medium, boundary]
